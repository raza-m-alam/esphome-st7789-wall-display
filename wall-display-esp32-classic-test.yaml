substitutions:
  device_name: "st7789-classic-test"
  friendly_name: "ST7789 Classic Test"
  ble_start_delay: "90s"
  ble_window_duration: "20min"
  fallback_ap_delay: "22min"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"

  on_boot:
    priority: -100
    then:
      - switch.turn_on: tft_backlight
      - component.update: tft_display
      - script.execute: ble_recovery_delay

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none
  output_power: 20dB
  fast_connect: false
  reboot_timeout: 15min

  on_connect:
    then:
      - script.stop: ble_recovery_delay
      - script.stop: ble_setup_window
      - ble.disable:

  on_disconnect:
    then:
      - script.execute: ble_recovery_delay

  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret fallback_ap_password
    ap_timeout: "${fallback_ap_delay}"

captive_portal:

esp32_ble:
  name: "Wall Setup"
  enable_on_boot: false

esp32_improv:
  authorizer: none
  wifi_timeout: 90s

spi:
  id: spi_bus
  clk_pin: GPIO18
  mosi_pin: GPIO23

image:
  - platform: file
    file: "assets/demo/display_test_card.svg"
    id: display_test_card
    type: RGB
    resize: 170x320

switch:
  - platform: gpio
    id: tft_backlight
    name: "Backlight"
    pin: GPIO4
    restore_mode: ALWAYS_ON

display:
  - platform: mipi_spi
    id: tft_display
    model: ST7789V
    spi_id: spi_bus
    cs_pin: GPIO22
    dc_pin: GPIO16
    reset_pin: GPIO17
    data_rate: 5MHz
    spi_mode: MODE0
    color_order: BGR
    invert_colors: true
    color_depth: 16
    buffer_size: 12.5%
    dimensions:
      width: 170
      height: 320
      offset_width: 35
      offset_height: 0
    rotation: 0
    update_interval: never
    lambda: |-
      if (id(test_pattern).current_option() == "Sample Image") {
        it.image(0, 0, id(display_test_card));
        return;
      }

      it.fill(Color(0, 0, 0));
      it.filled_rectangle(10, 20, 150, 80, Color(255, 0, 0));
      it.filled_rectangle(10, 120, 150, 80, Color(0, 255, 0));
      it.filled_rectangle(10, 220, 150, 80, Color(0, 0, 255));

select:
  - platform: template
    id: test_pattern
    name: "Test Pattern"
    icon: "mdi:image-multiple"
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "RGB Bars"
      - "Sample Image"
    initial_option: "Sample Image"
    set_action:
      - component.update: tft_display

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    mac_address:
      name: "Wi-Fi MAC"
      entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: template
    name: "Start BLE Setup"
    icon: "mdi:bluetooth-connect"
    entity_category: config
    on_press:
      - script.stop: ble_recovery_delay
      - script.execute: ble_setup_window

script:
  - id: ble_recovery_delay
    mode: restart
    then:
      - delay: "${ble_start_delay}"
      - if:
          condition:
            wifi.connected:
          then:
            - ble.disable:
          else:
            - script.execute: ble_setup_window

  - id: ble_setup_window
    mode: restart
    then:
      - logger.log: "BLE setup window started"
      - ble.enable:
      - delay: "${ble_window_duration}"
      - ble.disable:
      - logger.log: "BLE setup window ended"
