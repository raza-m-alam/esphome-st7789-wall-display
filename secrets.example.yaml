# Copy these keys into ESPHome's active secrets.yaml and replace every
# placeholder. Never commit the real secrets.yaml file.

wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wifi_password: "REPLACE_WITH_WIFI_PASSWORD"
fallback_ap_password: "REPLACE_WITH_8_PLUS_CHARACTERS"
ota_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"

# ESPHome API encryption keys are 32 random bytes encoded as Base64.
# Generate one with ESPHome's device wizard or tools/generate_secrets.py.
api_encryption_key: "REPLACE_WITH_VALID_BASE64_API_KEY"
