# Copy these names into ESPHome's active secrets.yaml and replace every
# placeholder. Do not commit your real secrets.yaml.

wall_display_wifi_ssid: "REPLACE_WITH_WIFI_SSID"
wall_display_wifi_password: "REPLACE_WITH_WIFI_PASSWORD"
wall_display_fallback_password: "REPLACE_WITH_8_PLUS_CHARACTERS"
wall_display_ota_password: "REPLACE_WITH_A_LONG_RANDOM_PASSWORD"

# ESPHome API encryption keys are 32-byte base64 values. Let ESPHome
# generate one when creating a temporary device, or generate one securely.
wall_display_api_key: "REPLACE_WITH_VALID_BASE64_API_KEY"
