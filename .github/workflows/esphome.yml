name: ESPHome validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-compile:
    name: Validate and compile ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - wall-display.yaml
          - wall-display-esp32-classic-test.yaml

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ESPHome and media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "esphome==2026.7.3" -r requirements.txt

      - name: Create non-secret CI configuration
        shell: bash
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "CI_TEST_NETWORK"
          wifi_password: "ci-wifi-password"
          fallback_ap_password: "ci-fallback-password"
          ota_password: "ci-ota-password"
          api_encryption_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Validate ESPHome configuration
        run: esphome config "${{ matrix.configuration }}"

      - name: Compile firmware
        run: esphome compile "${{ matrix.configuration }}"
