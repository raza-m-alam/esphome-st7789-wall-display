name: ESPHome validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esphome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-compile:
    name: Validate and compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ESPHome and media dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "esphome==2026.7.3" -r requirements.txt

      - name: Create non-secret CI configuration
        shell: bash
        run: |
          cat > secrets.yaml <<'EOF'
          wall_display_wifi_ssid: "CI_TEST_NETWORK"
          wall_display_wifi_password: "ci-wifi-password"
          wall_display_fallback_password: "ci-fallback-password"
          wall_display_ota_password: "ci-ota-password"
          wall_display_api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          EOF

      - name: Validate ESPHome configuration
        run: esphome config wall-display.yaml

      - name: Compile firmware
        run: esphome compile wall-display.yaml
